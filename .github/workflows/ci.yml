name: CI for Mod
on:
  workflow_dispatch:
  push:
    branches:
      - stonecutter
      - releases/**
    paths:
      - src/**
      - versions/**
      - buildSrc/**
      - build.gradle.kts
      - settings.gradle.kts
      - stonecutter.gradle.kts
      - gradle/**

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # rg_modrinth is used only for published dependency metadata; CI tests the local Stonecutter jar
          - { mcversion: "1.21.1", mc-index: 0, java: "21", game-versions: "1.21.1", rg-modrinth: "1.1.0+build.51" }
          - { mcversion: "1.21.8", mc-index: 1, java: "21", game-versions: "1.21.8", rg-modrinth: "1.1.0+build.62" }
          - { mcversion: "1.21.10", mc-index: 2, java: "21", game-versions: "1.21.10", rg-modrinth: "1.1.0+build.68" }
          - { mcversion: "26.1.2", mc-index: 3, java: "25", game-versions: "26.1.2", rg-modrinth: "1.1.0+build.69" }
          - { mcversion: "26.2", mc-index: 4, java: "25", game-versions: "26.2", rg-modrinth: "1.1.0+build.70" }
    env:
      CI_BUILD: true
      PR_BUILD: false
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: checkout Stonecutter RollingGate
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RollingGate
          ref: stonecutter
          path: rolling-gate

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: versions/${{ matrix.mcversion }}/gradle.properties
          properties: 'neo_version minecraft_version'

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Stonecutter RollingGate
        working-directory: rolling-gate
        run: ./gradlew :${{ matrix.mcversion }}:build -Pmc_index=${{ matrix.mc-index }}

      - name: Get RollingGate artifact
        id: rolling_gate_artifact
        working-directory: rolling-gate
        shell: bash
        run: |
          jar=$(find versions/${{ matrix.mcversion }}/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print -quit)
          test -n "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew :${{ matrix.mcversion }}:build -Pmc_index=${{ matrix.mc-index }} -Prolling_gate_jar=rolling-gate/${{ steps.rolling_gate_artifact.outputs.jar }}

      - name: Get Version
        id: version
        run: |
          JAR=$(ls versions/${{ matrix.mcversion }}/build/libs/*.jar | grep -v sources.jar)
          VERSION=$(basename "$JAR" .jar | sed "s/^SiliconeDolls-neoforge-${{ matrix.mcversion }}-//")
          echo "jar=$(basename "$JAR")" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ matrix.mcversion }} ${{ steps.version.outputs.version }}"
          path: versions/${{ matrix.mcversion }}/build/libs/${{ steps.version.outputs.jar }}

      - name: Publish to maven
        run: ./gradlew :${{ matrix.mcversion }}:publish -Pmc_index=${{ matrix.mc-index }}
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        continue-on-error: true

      - name: gametest
        timeout-minutes: 15
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        with:
          minecraft_version: ${{ steps.properties.outputs.minecraft_version }}
          mod_loader: neoforge
          loader_version: ${{ steps.properties.outputs.neo_version }}
          mods: |
            versions/${{ matrix.mcversion }}/build/libs/${{ steps.version.outputs.jar }}
            rolling-gate/${{ steps.rolling_gate_artifact.outputs.jar }}

      - name: publish neoforge mc mod
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          name: "${{ matrix.game-versions }} | SiliconeDolls v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          game-versions: ${{ matrix.game-versions }}
          version-type: "alpha"
          java: ${{ matrix.java }}
          loaders: neoforge
          fail-mode: skip
          dependencies: |
            rolling_gate@${{ matrix.rg-modrinth }}(required){modrinth:HXsmHiKu}{curseforge:1194894}

          modrinth-id: 7rBlSqmp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1197018
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            versions/${{ matrix.mcversion }}/build/libs/${{ steps.version.outputs.jar }}
